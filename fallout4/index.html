<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warren Woodhouse: Fallout 4 Interactive Map [WIP]</title>
    <link rel="icon" type="image/x-icon" href="https://warrenwoodhouse.blogspot.com/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111; /* Dark background for off-map areas */
        }
        .leaflet-popup-content-wrapper {
            background: #2a2a2a;
            color: #14ff14; /* Classic Fallout Terminal Green */
            border: 1px solid #14ff14;
            border-radius: 4px;
        }
        .leaflet-popup-tip {
            background: #2a2a2a;
        }
    </style>
</head>
<body>
    <p style="color:white;">This map is a work in progress.</p>
    <p style="color:white;">If the map isn't loading, give it 5-10 minutes for the mapping data to sync after an update that I've made.</p>
    <p style="color:white;"><a href="https://warrenwoodhouse.blogspot.com/maps/interactive">CLICK HERE</a> to see more Interactive Maps by Warren Woodhouse.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Define Map Dimensions
        const mapWidth = 2048;
        const mapHeight = 2048;

        // Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,  // Allows zooming out further than the image
            maxZoom: 3
        });

        // Set Bounds. Top-Left is [0, 0], Bottom-Right is [-2048, 2048]
        const bounds = [[0, 0], [-mapHeight, mapWidth]];

        // Load the 2048x2048 Image Overlay
        // IMPORTANT: Replace 'maps-fallout4.PNG' with your actual image file name
        const image = L.imageOverlay('maps-fallout4.PNG', bounds).addTo(map);
        map.fitBounds(bounds);

        // Create Layer Groups for Filters
        const settlements = L.layerGroup();
        const vaults = L.layerGroup();
        const landmarks = L.layerGroup();
        
        // --- HELPER FUNCTIONS ---

// Convert standard (X, Y) pixel coordinates to Leaflet LatLng
function xyToLatLng(x, y) {
    return L.latLng(-y, x);
}

// Convert a Leaflet LatLng object back to standard (X, Y) pixels
function latLngToXY(latlng) {
    return {
        x: Math.round(latlng.lng),
        y: Math.round(-latlng.lat)
    };
}

// Example: Clicking the map logs the exact (X, Y) pixel
map.on('click', function(e) {
    const pixelCoords = latLngToXY(e.latlng);
    console.log(`You clicked on Pixel X: ${pixelCoords.x}, Y: ${pixelCoords.y}`);
});
        
        // Location Database
        // Y = Vertical axis (0 is bottom, 2048 is top)
        // X = Horizontal axis (0 is left, 2048 is right)
        // These coordinates are estimates to show you the scaling on a 2048 grid.
        const locations = [
            // Settlements
            { id: "1", name: "Sanctuary Hills", type: "settlement", y: -200, x: 350 },
            { id: "3", name: "Red Rocket Truck Stop", type: "settlement", y: 240, x: 375 },
            { id: "108", name: "The Castle", type: "settlement", y: -1218, x: 1474 },
            { id: "228", name: "Spectacle Island", type: "settlement", y: -1317, x: 1684 },
            { id: "6", name: "Abernathy Farm", type: "settlement", y: -337, x: 507 },
            { id: "34", name: "Greentop Nursery", type: "settlement", y: -338, x: 1330 },
            { id: "252", name: "Home Plate", type: "settlement", y: -1064, x: 972 },
            { id: "79", name: "Covenant", type: "settlement", y: -495, x: 1040 },
            
            // Vaults
            { id: "2", name: "Vault 111", type: "vault", y: -146, x: 409 },
            { id: "81", name: "Vault 81", type: "vault", y: -1037, x: 809 },
            { id: "114", name: "Vault 114", type: "vault", y: -986, x: 1171 },
            { id: "95", name: "Vault 95", type: "vault", y: -1548, x: 722 },

            // Major Landmarks
            { id: "66", name: "Diamond City", type: "landmark", y: 1100, x: 1024 },
            { id: "78", name: "Goodneighbor", type: "landmark", y: -949, x: 1264 },
            { id: "42", name: "Concord", type: "landmark", y: -297, x: 636 },
            { id: "48", name: "Lexington", type: "landmark", y: -544, x: 846 },
            { id: "234", name: "Edge of the Glowing Sea", type: "landmark", y: -1466, x: 667 }
        ];

        // Loop Through Data to Create Markers
        locations.forEach(loc => {
            // Leaflet requires [Y, X] for marker placement
            const marker = L.marker([loc.y, loc.x])
                .bindPopup(`<strong>${loc.name}</strong><br>Location ID: ${loc.id}`);
            
            // Route the marker to the correct filter group based on its type
            if (loc.type === "settlement") {
                marker.addTo(settlements);
            } else if (loc.type === "vault") {
                marker.addTo(vaults);
            } else if (loc.type === "landmark") {
                marker.addTo(landmarks);
            }
        });

        // Add Default Layers to the Map
        settlements.addTo(map);
        vaults.addTo(map);
        landmarks.addTo(map);

        // Build the Filter Control Menu
        const filterControls = {
            "Settlements": settlements,
            "Vaults": vaults,
            "Major Landmarks": landmarks,
        };

        // Add the toggle menu to the top right of the map
        L.control.layers(null, filterControls, { collapsed: false }).addTo(map);

    </script>
</body>
</html>
