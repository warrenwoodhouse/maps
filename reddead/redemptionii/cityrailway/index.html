  <title>Sanis Denis Trolley Interactive Map - Red Dead Redemption II Interactive Map - Maps - Warren Woodhouse</title>
  <meta name="description" content="An interactive map of the trolley service in Saint Denis for the game Red Dead Redemption II.">
  <meta name="keywords" content="Sanis Denis Trolley Interactive Map, Red Dead Redemption II Interactive Map, Red Dead Redemption II, rdr2, #RDR2, #warrenwoodhouse, warrenwoodhouse, Warren Woodhouse, gaming, game maps, interactive maps, game guides">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111;

        }
        .filterControls {
            font-size: 19px;
        }
        .leaflet-popup-content-wrapper {
            background: #ffffff;

        }

        .popup-image {
            width: 100%;

            margin-bottom: 10px;
            border-radius: 4px;
            max-height: 250px;
            object-fit: cover;

        }
        .popup-text {
            margin: 8px 0;
        }
        .popup-text strong {
            display: block;

            background-color: #333;
        }
    </style>
</head>
<body>
    <p style="color:white; margin: 10px;">Sanis Denis Trolley Interactive Map - Red Dead Redemption II Interactive Map - Maps - Warren Woodhouse</p>
    <p style="color:white; margin: 10px;">Map by Warren Woodhouse. <a href="https://warrenwoodhouse.github.io/maps" style="color: #4da6ff;">CLICK HERE</a> to see more Interactive Maps.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 1856;
        const mapHeight = 1036;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 1856x1036 Image Overlay
        L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/main/reddead/redemptionii/cityrailway/map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const filterGroups = {
            red: { name: "Red Loop", group: L.layerGroup() },
            blue: { name: "Blue Loop", group: L.layerGroup() },
            unknown: { name: "Unknown Loop", group: L.layerGroup() }
        };

        // Create custom icons for each marker type
        const customIcons = {
            red: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/reddead/redemptionii/cityrailway/icon-marker.png',
                iconSize: [32, 32]
            }),
            blue: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/reddead/redemptionii/cityrailway/icon-marker.png',
                iconSize: [32, 32]
            }),
            unknown: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/reddead/redemptionii/cityrailway/icon-marker.png',
                iconSize: [32, 32]
            })
        };

        // 6. Location Database
        const locations = [
            // Red Loop
            { id: "red-1", name: "Milyonne Avenue Stop", type: "red", y: 953, x: 548, image: "" },
            { id: "red-2", name: "Chitimacha Street Stop", type: "red", y: 818, x: 230, image: "" },
            { id: "red-3", name: "Hestia Street Stop", type: "red", y: 502, x: 336, image: "" },
            { id: "red-4", name: "Harris Square Stop", type: "red", y: 904, x: 692, image: "" },
            // Blue Loop
            { id: "blue-1", name: "Victory Street Trolley Station / Victoria Street Station", type: "blue", y: 38, x: 1182, image: "" },
            { id: "blue-2", name: "Warehouse District Stop", type: "blue", y: 120, x: 990, image: "" },
            { id: "blue-3", name: "Mansion District Stop", type: "blue", y: 456, x: 764, image: "" },
            { id: "blue-4", name: "Harris Square Stop", type: "blue", y: 910, x: 750, image: "" },
            { id: "blue-5", name: "Old Quarter Stop", type: "blue", y: 982, x: 1152, image: "" },
            { id: "blue-6", name: "St. Francis District Stop", type: "blue", y: 850, x: 1436, image: "" },
            { id: "blue-7", name: "Market District Stop", type: "blue", y: 558, x: 1500, image: "" },
            { id: "blue-8", name: "Victory Street Docks Stop", type: "blue", y: 342, x: 1576, image: "" },
            // Unknown Loop
            { id: "unknown-1", name: "La Marque Street Stop", type: "unknown", y: 464, x: 888, image: "" },
            { id: "unknown-2", name: "Courtenay Street Stop", type: "unknown", y: 718, x: 1144, image: "" }
        ];

        // 6. Registry to look up markers by ID
        const markerRegistry = {};
        let currentOpenMarkerId = null;

        // 7. Initialize URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlMarkerId = urlParams.get('marker');
        const urlFilters = urlParams.get('filters') ? urlParams.get('filters').split(',') : null;

        // 8. Add Markers & Populate Layer Groups
        locations.forEach(loc => {
            const popupContent = `
                <div>
                    ${loc.image ? `<img src="${loc.image}" alt="${loc.name}" class="popup-image" onerror="this.style.display='none'">` : ''}
                    <div class="popup-text">
                        <strong>${loc.name}</strong>
                        <small>ID: ${loc.id}</small>
                    </div>
                    <button class="share-btn" onclick="copyShareableUrl('${loc.id}')">📋 Copy Share Link</button>
                </div>
            `;

            const marker = L.marker([loc.y, loc.x], { icon: customIcons[loc.type] }).bindPopup(popupContent);
            markerRegistry[loc.id] = { marker, type: loc.type, coords: [loc.y, loc.x] };

            if (filterGroups[loc.type]) {
                marker.addTo(filterGroups[loc.type].group);
            }

            // Update URL when a marker popup is opened/closed
            marker.on('popupopen', () => {
                currentOpenMarkerId = loc.id;
                updateURL();
            });

            marker.on('popupclose', () => {
                if (currentOpenMarkerId === loc.id) {
                    currentOpenMarkerId = null;
                    updateURL();
                }
            });
        });

        // 9. Apply Active Filter Groups to Map
        const layerControls = {};
        Object.keys(filterGroups).forEach(key => {
            const groupInfo = filterGroups[key];
            layerControls[groupInfo.name] = groupInfo.group;

            // If filters are specified in URL, enable matching ones; otherwise enable all by default
            if (!urlFilters || urlFilters.includes(key)) {
                groupInfo.group.addTo(map);
            }
        });

        // Add Leaflet Layer Control
        L.control.layers(null, layerControls, { collapsed: false }).addTo(map);

        // Listen for filter toggle events to sync URL
        map.on('overlayadd overlayremove', updateURL);

        // 10. Functions to Handle URL State & Copying
        function updateURL() {
            const activeFilters = Object.keys(filterGroups).filter(key => map.hasLayer(filterGroups[key].group));
            const params = new URLSearchParams();

            if (activeFilters.length > 0 && activeFilters.length < Object.keys(filterGroups).length) {
                params.set('filters', activeFilters.join(','));
            }

            if (currentOpenMarkerId) {
                params.set('marker', currentOpenMarkerId);
            }

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
        }

        function copyShareableUrl(markerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('marker', markerId);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert('Shareable link copied to the Notebook!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        // 11. Initial View & Deep Linking Setup
        if (urlMarkerId && markerRegistry[urlMarkerId]) {
            const target = markerRegistry[urlMarkerId];
            
            // Ensure the parent layer group is visible
            if (!map.hasLayer(filterGroups[target.type].group)) {
                filterGroups[target.type].group.addTo(map);
            }

            map.setView(target.coords, 1);
            target.marker.openPopup();
        } else {
            map.fitBounds(bounds);
        }
    </script>
