  <meta name="description" content="An interactive map of Bright Falls for the game Alan Wake, complete with points of interest, collectibles and more.">
  <meta name="keywords" content="Bright Falls Interactive Map, Bright Falls, State of Washington, Alan Wake, #AlanWake, #warrenwoodhouse, warrenwoodhouse, Warren Woodhouse, gaming, game maps, interactive maps, free maps, interactive maps, game guides">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111;

</head>
<body>
    <p style="color:white; margin: 10px;">Bright Falls Interactive Map - Alan Wake Interactive Map - Maps - Warren Woodhouse</p>
    <p style="color:white; margin: 10px;">Map by Warren Woodhouse. <a href="https://warrenwoodhouse.github.io/maps" style="color: #4da6ff;">CLICK HERE</a> to see more Interactive Maps.</p>
    <p style="color:white; margin: 10px;">Select the icon to the right to open the Filters and select anywhere on the map to close the Filters list, making it easier for you to navigate.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 1551;
        const mapHeight = 1497;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 1551x1497 Image Overlay
        L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/main/alanwake/brightfalls/map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const filterGroups = {
            poi: { name: "Points of Interests", group: L.layerGroup() },
            dam: { name: "Dams", group: L.layerGroup() },
            tunnel: { name: "Tunnels", group: L.layerGroup() },
            powerstation: { name: "Power Stations", group: L.layerGroup() },
            lake: { name: "Lakes", group: L.layerGroup() },
            river: { name: "Rivers", group: L.layerGroup() },
            policestation: { name: "Police Stations", group: L.layerGroup() },
            lodging: { name: "Lodges, Hotels & Motels", group: L.layerGroup() },
            campground: { name: "Campgrounds", group: L.layerGroup() },
            museum: { name: "Museums", group: L.layerGroup() },
            park: { name: "National Parks", group: L.layerGroup() },
            mountain: { name: "Mountains", group: L.layerGroup() },
            eatery: { name: "Eateries", group: L.layerGroup() },
            gasstation: { name: "Gas Stations", group: L.layerGroup() },
            town: { name: "Towns", group: L.layerGroup() },
            landmark: { name: "Landmarks", group: L.layerGroup() }
        };

        // Create custom icons for each marker type
        const customIcons = {
            poi: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            dam: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            tunnel: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            powerstation: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            lake: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            river: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            policestation: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            lodging: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            campground: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            museum: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            park: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            mountain: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            eatery: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            gasstation: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            town: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            }),
            landmark: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/alanwake/icon-marker.png',
                iconSize: [32, 32]
            })
        };

        // 6. Location Database
        const locations = [
            // Points of Interests
            { id: "poi-1", name: "P.E. Freight Depot", type: "poi", y: 490, x: 3916, image: "" },
            { id: "poi-2", name: "Central Guns", type: "poi", y: 887, x: 3882, image: "" },
            // Dams
            // Tunnels
            // Power Stations
            // Lakes
            // Rivers
            // Police Stations
            // Lodges, Hotels & Motels
            // Campgrounds
            // Museums
            // National Parks
            // Mountains
            // Eateries
            // Gas Stations
            // Towns
            // Landmarks
        ];

        // 6. Registry to look up markers by ID
        const markerRegistry = {};
        let currentOpenMarkerId = null;

        // 7. Initialize URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlMarkerId = urlParams.get('marker');
        const urlFilters = urlParams.get('filters') ? urlParams.get('filters').split(',') : null;

        // 8. Add Markers & Populate Layer Groups
        locations.forEach(loc => {
            const popupContent = `
                <div>
                    ${loc.image ? `<img src="${loc.image}" alt="${loc.name}" class="popup-image" onerror="this.style.display='none'">` : ''}
                    <div class="popup-text">
                        <strong>${loc.name}</strong>
                        <small>ID: ${loc.id}</small>
                    </div>
                    <button class="share-btn" onclick="copyShareableUrl('${loc.id}')">📋 Copy Share Link</button>
                </div>
            `;

            const marker = L.marker([loc.y, loc.x], { icon: customIcons[loc.type] }).bindPopup(popupContent);
            markerRegistry[loc.id] = { marker, type: loc.type, coords: [loc.y, loc.x] };

            if (filterGroups[loc.type]) {
                marker.addTo(filterGroups[loc.type].group);
            }

            // Update URL when a marker popup is opened/closed
            marker.on('popupopen', () => {
                currentOpenMarkerId = loc.id;
                updateURL();
            });

            marker.on('popupclose', () => {
                if (currentOpenMarkerId === loc.id) {
                    currentOpenMarkerId = null;
                    updateURL();
                }
            });
        });

        // 9. Apply Active Filter Groups to Map
        const layerControls = {};
        Object.keys(filterGroups).forEach(key => {
            const groupInfo = filterGroups[key];
            layerControls[groupInfo.name] = groupInfo.group;

            // If filters are specified in URL, enable matching ones; otherwise enable all by default
            if (!urlFilters || urlFilters.includes(key)) {
                groupInfo.group.addTo(map);
            }
        });

        // Add Leaflet Layer Control
        L.control.layers(null, layerControls, { collapsed: true }).addTo(map);

        // Listen for filter toggle events to sync URL
        map.on('overlayadd overlayremove', updateURL);

        // 10. Functions to Handle URL State & Copying
        function updateURL() {
            const activeFilters = Object.keys(filterGroups).filter(key => map.hasLayer(filterGroups[key].group));
            const params = new URLSearchParams();

            if (activeFilters.length > 0 && activeFilters.length < Object.keys(filterGroups).length) {
                params.set('filters', activeFilters.join(','));
            }

            if (currentOpenMarkerId) {
                params.set('marker', currentOpenMarkerId);
            }

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
        }

        function copyShareableUrl(markerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('marker', markerId);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert('Shareable link copied to the Manuscript!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        // 11. Initial View & Deep Linking Setup
        if (urlMarkerId && markerRegistry[urlMarkerId]) {
            const target = markerRegistry[urlMarkerId];
            
            // Ensure the parent layer group is visible
            if (!map.hasLayer(filterGroups[target.type].group)) {
                filterGroups[target.type].group.addTo(map);
            }

            map.setView(target.coords, 1);
            target.marker.openPopup();
        } else {
            map.fitBounds(bounds);
        }
    </script>
</body>
