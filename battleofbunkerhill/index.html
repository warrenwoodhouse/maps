<html>
<head>
    <title>Battle of Bunker Hill Map - Historical Maps - Maps - Warren Woodhouse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h3>Battle of Bunker Hill Map (Historical Maps) (Maps)</h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 4. Initialize the map
        var map = L.map('map').setView([42.376361, -71.060778], 18);

        // 5. Add OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors; Made using Leaflet; Map by Warren Woodhouse'
        }).addTo(map);

        // 6. Add a Marker
        L.marker([42.376361, -71.060778]).addTo(map)
            .bindPopup('Location of the Battle of Bunker Hill')
            .openPopup();
    </script>
</body>
</html>
