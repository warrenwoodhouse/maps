        // 1. Define Map Dimensions
        const mapWidth = 1365;
        const mapHeight = 768;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 1365x768 Image Overlay

        // 5. Create Layer Groups for Filters

            flower: { name: "Flowers", group: L.layerGroup() },
            diary: { name: "Diaries", group: L.layerGroup() },

            }),

                iconSize: [52, 52]
            }),
            bear: L.icon({

                iconSize: [52, 52]
            }),
            seal: L.icon({

                iconSize: [52, 52]

                iconSize: [52, 52]

        // 6. Location Database
        const locations = [
            // Seeds
            { id: "seed-1", name: "The Dome", type: "seed", y: 388, x: 653, image: "" },

            { id: "seed-10", name: "Siachen Cathedral", type: "seed", y: 198, x: 458, image: "" },
            // Flowers
            // Diaries
            // Lookouts
            { id: "lookout-1", name: "Lookout", type: "lookout", y: 656, x: 468, image: "" },
            { id: "lookout-2", name: "Lookout", type: "lookout", y: 495, x: 360, image: "" },
            { id: "lookout-3", name: "Lookout", type: "lookout", y: 358, x: 445, image: "" },
            { id: "lookout-4", name: "Lookout", type: "lookout", y: 177, x: 535, image: "" },
            { id: "lookout-5", name: "Lookout", type: "lookout", y: 58, x: 489, image: "" },
            { id: "lookout-6", name: "Lookout", type: "lookout", y: 638, x: 829, image: "" },
            { id: "lookout-7", name: "Lookout", type: "lookout", y: 421, x: 723, image: "" },
            { id: "lookout-8", name: "Lookout", type: "lookout", y: 566, x: 1000, image: "" },
            { id: "lookout-9", name: "Lookout", type: "lookout", y: 339, x: 952, image: "" },
            { id: "lookout-10", name: "Lookout", type: "lookout", y: 53, x: 849, image: "" },
            // Relics
            // Boat Upgrades
            // Landmarks
            { id: "landmark-1", name: "The Stone Ribbons", type: "landmark", y: 488, x: 757, image: "" },
            { id: "landmark-2", name: "Titan‘s Reach", type: "landmark", y: 262, x: 732, image: "" },
            { id: "landmark-3", name: "Mother‘s Gaze", type: "landmark", y: 32, x: 614, image: "" },
            { id: "landmark-4", name: "House of the Goddess", type: "landmark", y: 106, x: 389, image: "" },
            { id: "landmark-5", name: "The Shattered Bowl", type: "landmark", y: 287, x: 323, image: "" },
            { id: "landmark-6", name: "The Night‘s Eye", type: "landmark", y: 719, x: 341, image: "" },
            { id: "landmark-7", name: "The Serpent‘s Spine", type: "landmark", y: 693, x: 612, image: "" },
            { id: "landmark-8", name: "The Broken Pass", type: "landmark", y: 686, x: 965, image: "" },
            { id: "landmark-9", name: "The Ocean‘s Cage", type: "landmark", y: 366, x: 1014, image: "" },
            { id: "landmark-10", name: "The Woven Wreck", type: "landmark", y: 170, x: 1012, image: "" }
            // Styles
            // Creatures
        ];

        // 6. Registry to look up markers by ID
        const markerRegistry = {};
        let currentOpenMarkerId = null;

        // 7. Initialize URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlMarkerId = urlParams.get('marker');
        const urlFilters = urlParams.get('filters') ? urlParams.get('filters').split(',') : null;

        // 8. Add Markers & Populate Layer Groups
        locations.forEach(loc => {
            const popupContent = `
                <div>
                    ${loc.image ? `<img src="${loc.image}" alt="${loc.name}" class="popup-image" onerror="this.style.display='none'">` : ''}
                    ${loc.video ? `<iframe width="300px" height="170px" src="${loc.video}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen class="popup-video" onerror="this.style.display='none'"></iframe>` : ''}
                    <div class="popup-text">
                        <strong>${loc.name}</strong>
                        <strong>ID: ${loc.id}</strong>
                        <strong>Description: ${loc.description}</strong>
                    </div>
                    <button class="share-btn" onclick="copyShareableUrl('${loc.id}')">📋 Copy Share Link</button>
                </div>
            `;

            const marker = L.marker([loc.y, loc.x], { icon: customIcons[loc.type] }).bindPopup(popupContent);
            markerRegistry[loc.id] = { marker, type: loc.type, coords: [loc.y, loc.x] };

            if (filterGroups[loc.type]) {
                marker.addTo(filterGroups[loc.type].group);
            }

            // Update URL when a marker popup is opened/closed
            marker.on('popupopen', () => {
                currentOpenMarkerId = loc.id;
                updateURL();
            });

            marker.on('popupclose', () => {
                if (currentOpenMarkerId === loc.id) {
                    currentOpenMarkerId = null;
                    updateURL();
                }
            });
        });

        // 9. Apply Active Filter Groups to Map
        const layerControls = {};
        Object.keys(filterGroups).forEach(key => {
            const groupInfo = filterGroups[key];
            layerControls[groupInfo.name] = groupInfo.group;

            // If filters are specified in URL, enable matching ones; otherwise enable all by default
            if (!urlFilters || urlFilters.includes(key)) {
                groupInfo.group.addTo(map);
            }
        });

        // Add Leaflet Layer Control
        L.control.layers(null, layerControls, { collapsed: true }).addTo(map);

        // Listen for filter toggle events to sync URL
        map.on('overlayadd overlayremove', updateURL);

        // 10. Functions to Handle URL State & Copying
        function updateURL() {
            const activeFilters = Object.keys(filterGroups).filter(key => map.hasLayer(filterGroups[key].group));
            const params = new URLSearchParams();

            if (activeFilters.length > 0 && activeFilters.length < Object.keys(filterGroups).length) {
                params.set('filters', activeFilters.join(','));
            }

            if (currentOpenMarkerId) {
                params.set('marker', currentOpenMarkerId);
            }

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
        }

        function copyShareableUrl(markerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('marker', markerId);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert('Shareable link copied to the Diary!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        // 11. Initial View & Deep Linking Setup
        if (urlMarkerId && markerRegistry[urlMarkerId]) {
            const target = markerRegistry[urlMarkerId];
            
            // Ensure the parent layer group is visible
            if (!map.hasLayer(filterGroups[target.type].group)) {
                filterGroups[target.type].group.addTo(map);
            }

            map.setView(target.coords, 1);
            target.marker.openPopup();
        } else {
            map.fitBounds(bounds);
        }
    </script>
