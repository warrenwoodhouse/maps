<html>
<head>
    <meta charset="UTF-8">
    <title>Martha is Dead Interactive Map - Maps - Warren Woodhouse</title>
    <link rel="icon" type="image/x-icon" href="https://warrenwoodhouse.blogspot.com/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111; /* Dark background for off-map areas */
        }
        .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
        }
        .leaflet-popup-tip {
            background: #ffffff;
        }
    </style>
</head>
<body>
    <p style="color:white;">Martha is Dead Interactive Map - Maps - Warren Woodhouse</p>
    <p style="color:white;">Map by Warren Woodhouse. <a href="https://warrenwoodhouse.github.io/maps">CLICK HERE</a> to see more Interactive Maps.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 1920;
        const mapHeight = 1080;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,  // Allows zooming out further than the image
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 1920x1080 Image Overlay
        // IMPORTANT: Replace 'map.png' with your actual image file name
        L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/main/marthaisdead/map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const poiGroup = L.layerGroup();
        const bunkerGroup = L.layerGroup();
        const cameraaccessoryGroup = L.layerGroup();
        const irphotoGroup = L.layerGroup();
        const irladyGroup = L.layerGroup();
        const sideGroup = L.layerGroup();

        // 6. Location Database
        // Y = Vertical axis (0 is bottom, 1920 is top)
        // X = Horizontal axis (0 is left, 1080 is right)
        // These coordinates are estimates to show you the scaling on a 1080 grid.
        const locations = [
            // Point of Interest
            { id: "poi-1", name: "Family Home", type: "poi", y: 858, x: 132 },
            { id: "poi-2", name: "Family Church", type: "poi", y: 638, x: 252 },
            { id: "poi-3", name: "The Cemetery", type: "poi", y: 88, x: 288 },
            { id: "poi-4", name: "Crossroads", type: "poi", y: 494, x: 180 },
            { id: "poi-5", name: "Family Graveyard", type: "poi", y: 982, x: 510 },
            { id: "poi-6", name: "The Lake", type: "poi", y: 736, x: 1374 },
            { id: "poi-7", name: "The Island", type: "poi", y: 624, x: 1708 },
            { id: "poi-8", name: "Wine Cellar - Family Home", type: "poi", y: 736, x: 276 },
            { id: "poi-9", name: "House in The Woods", type: "poi", y: 778, x: 472 },
            // Bunker
            { id: "bunker-1", name: "Bunker", type: "bunker", y: 1018, x: 1372 },
            // Camera Accessory
            { id: "cameraaccessory-1", name: "100 ISO Film (Chapter: The Room)", type: "cameraaccessory", y: 239, x: 239 },
            { id: "cameraaccessory-2", name: "Flash (Chapter: The Room)", type: "cameraaccessory", y: 858, x: 114 },
            { id: "cameraaccessory-3", name: "Tripod (Chapter: The Rolls)", type: "cameraaccessory", y: 764, x: 317 },
            { id: "cameraaccessory-4", name: "Infrared Lens & Film (Chapter: The Rolls)", type: "cameraaccessory", y: 798, x: 229 },
            { id: "cameraaccessory-5", name: "Macro Lens, Orange Filter & Blue Filter (Chapter: The Rolls)", type: "cameraaccessory", y: 763, x: 225 },
            { id: "cameraaccessory-6", name: "25 ISO Film (Chapter: The Woods)", type: "cameraaccessory", y: 845, x: 117 },
            { id: "cameraaccessory-7", name: "Focal Lens x0.5, Macro Lens & Focal Lens x2 (Chapter: The Woods)", type: "cameraaccessory", y: 774, x: 196 },
            { id: "cameraaccessory-8", name: "Red Filter (Chapter: The Woods)", type: "cameraaccessory", y: 760, x: 209 },
            // IR Photo
            { id: "irphoto-1", name: "IR Photo 1", type: "irphoto", y: 749, x: 332 },
            { id: "irphoto-2", name: "IR Photo 2", type: "irphoto", y: 621, x: 251 },
            { id: "irphoto-3", name: "IR Photo 3", type: "irphoto", y: 477, x: 160 },
            { id: "irphoto-4", name: "IR Photo 4", type: "irphoto", y: 784, x: 1116 },
            { id: "irphoto-5", name: "IR Photo 5", type: "irphoto", y: 746, x: 656 },
            { id: "irphoto-6", name: "IR Photo 6", type: "irphoto", y: 532, x: 371 },
            // IR Lady
            { id: "irlady-1", name: "IR Lady 1", type: "irlady", y: 871, x: 269 },
            { id: "irlady-2", name: "IR Lady 2", type: "irlady", y: 519, x: 309 },
            { id: "irlady-3", name: "IR Lady 3", type: "irlady", y: 786, x: 448 },
            { id: "irlady-4", name: "IR Lady 4", type: "irlady", y: 844, x: 793 },
            // Side Quests
            { id: "side-1", name: "Telegraph Pole (Side Quest: Lapo’s quest)", type: "side", y: 570, x: 186 },
            { id: "side-2", name: "Telegraph Machine (Side Quest: Lapo’s quest)", type: "side", y: 906, x: 64 }
        ];

        // 7. Loop Through Data to Create Markers
        locations.forEach(loc => {
            // Leaflet requires [Y, X] for marker placement
            const marker = L.marker([loc.y, loc.x])
                .bindPopup(`<strong>${loc.name}</strong><br>Location ID: ${loc.id}`);
            
            // Route the marker to the correct filter group based on its type
            if (loc.type === "poi") {
                marker.addTo(poiGroup);
            } else if (loc.type === "bunker") {
                marker.addTo(bunker group);
            } else if (loc.type === "cameraaccessory") {
                marker.addTo(cameraaccessoryGroup);
            } else if (loc.type === "irphoto") {
                marker.addTo(irphoto group);
            } else if (loc.type === "irlady") {
                marker.addTo(irladyGroup);
            } else if (loc.type === "side") {
                marker.addTo(sideGroup);
        });

        // 8. Add Default Layers to the Map
        poiGroup.addTo(map);
        bunkerGroup.addTo(map);
        cameraaccessoryGroup.addTo(map);
        irphotoGroup.addTo(map);
        irladyGroup.addTo(map);
        sideGroup.addTo(map);

        // 9. Build the Filter Control Menu
        const filterControls = {
            "Point of Interest": poiGroup,
            "Bunkers": bunkerGroup,
            "Camera Accessory": cameraaccessoryGroup,
            "IR Photo": irphotoGroup,
            "IR Lady": irladyGroup,
            "Side Quests": sideGroup
        };

             // Add the toggle menu to the top right of the map
        L.control.layers(null, filterControls, { collapsed: false }).addTo(map);
    </script>
</body>
</html>
