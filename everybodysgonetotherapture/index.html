<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Warren Woodhouse: Everybody's Gone To The Rapture Interactive Map</title>
    <link rel="icon" type="image/x-icon" href="https://warrenwoodhouse.blogspot.com/favicon.ico">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #a58843;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111; /* Dark background for off-map areas */
        }
        .leaflet-popup-content-wrapper {
            background: #a58843;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
        }
        .leaflet-popup-tip {
            background: #a58843;
        }
    </style>
</head>
<body>
    <p style="color:white;">This map is a work in progress.</p>
    <p style="color:white;">If the map isn't loading, give it 5-10 minutes for the mapping data to sync after an update that I've made.</p>
    <p style="color:white;"><a href="https://warrenwoodhouse.blogspot.com/maps/interactive">CLICK HERE</a> to see more Interactive Maps by Warren Woodhouse.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 2046;
        const mapHeight = 1557;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,  // Allows zooming out further than the image
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 2046x1557 Image Overlay
        // IMPORTANT: Replace 'map-everybodysgonetotherapture.png' with your actual image file name
        L.imageOverlay('map-everybodysgonetotherapture.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const areas = L.layerGroup();

        // 6. Location Database
        // Y = Vertical axis (0 is bottom, 1557 is top)
        // X = Horizontal axis (0 is left, 2046 is right)
        // These coordinates are estimates to show you the scaling on a 1557 grid.
        const locations = [
            // Areas
            { id: "area-1", name: "Valis Observatory", type: "areas", y: 0, x: 0 },
            { id: "area-2", name: "Yaughton", type: "areas", y: 100, x: 100 },
            { id: "area-3", name: "Tipworth Forest", type: "areas", y: 200, x: 200 },
            { id: "area-4", name: "Appleton's Farm", type: "areas", y: 300, x: 300 },
            { id: "area-5", name: "Lakeside", type: "areas", y: 400, x: 400 },
            { id: "area-6", name: "Little Tipworth", type: "areas", y: 500, x: 500 },
            
            // Radio Enthusiast (Trophy)
            { id: "radio-1", name: "Radio in Gate House", type: "radio", y: 281.62212336254885, x: 806.94303695376 },

            // You Are Here Maps (Trophy)
            { id: "youarehere-1", name: "Map in Gate House", type: "youarehere", y: 281.62212336254885, x: 818.9620076505083 }
        ];

        // 7. Loop Through Data to Create Markers
        locations.forEach(loc => {
            // Leaflet requires [Y, X] for marker placement
            const marker = L.marker([loc.y, loc.x])
                .bindPopup(`<strong>${loc.name}</strong><br>Location ID: ${loc.id}`);
            
            // Route the marker to the correct filter group based on its type
            if (loc.type === "areas") {
                marker.addTo(areas);
                marker.addTo(youarehere);
                marker.addTo(radio);
            }
        });

        // 8. Add Default Layers to the Map
        areas.addTo(map);

        // 9. Build the Filter Control Menu
        const filterControls = {
            "Areas": areas
            "Public Footpath": publicfootpath
            "Pub": pub
            "Surgery": surgery
            "Radio Enthusiast (Trophy)": radio
            "Tea Leaf (Trophy)": tealeaf
            "Hidden Paths (Trophy)": hiddenpaths
            "Witches Hat (Trophy)": witcheshat
            "Trainspotter (Trophy)": trainspotter
            "You Are Here Maps": youarehere
            "Coded Messages": codedmessages
            "Chads (Trophy)": chads
        };

        // Add the toggle menu to the top right of the map
        L.control.layers(null, filterControls, { collapsed: false }).addTo(map);

    </script>
</body>
</html>
