  <title>Everybody's Gone To The Rapture Interactive Map - Maps - Warren Woodhouse</title>
  <meta name="description" content="An interactive map for the game Everybody's Gone To The Rapture, complete with points of interest, collectibles, trophies/achievements and more.">
  <meta name="keywords" content="Everybody's Gone To The Rapture Interactive Map, Everybody's Gone To The Rapture, #EverybodysGoneToTheRapture, #warrenwoodhouse, warrenwoodhouse, Warren Woodhouse, gaming, game maps, interactive maps, free maps, interactive maps, game guides">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
        }
        #map {
            width: 100vw;
            height: 100vh;
            background-color: #111; /* Dark background for off-map areas */
            font-size: 20px;
        }
        .filterControls {
            font-size: 19px;
        }
        .leaflet-popup-content-wrapper {
            background: #ffffff;
            color: #000000;
            border: 1px solid #000000;
            border-radius: 4px;
            font-size: 19px;
        }
        .leaflet-popup-tip {
            background: #ffffff;
            font-size: 19px;
        }
        .share-btn {
            margin-top: 8px;
            padding: 6px 12px;
            background-color: #111;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 19px;
        }
        .share-btn:hover {
            background-color: #333;
        }
    </style>
</head>
<body>
    <p style="color:white; margin: 10px;">Everybody's Gone To The Rapture Interactive Map - Maps - Warren Woodhouse</p>
    <p style="color:white; margin: 10px;">Map by Warren Woodhouse. <a href="https://warrenwoodhouse.github.io/maps" style="color: #4da6ff;">CLICK HERE</a> to see more Interactive Maps.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 1920;
        const mapHeight = 1080;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,  // Allows zooming out further than the image
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 1920x1080 Image Overlay
        L.imageOverlay('https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const filterGroups = {
            poi: { name: "Points of Interests", group: L.layerGroup() },
            phone: { name: "Phones & Telephone Boxes", group: L.layerGroup() },
            youarehere: { name: "You Are Here Maps", group: L.layerGroup() },
            lookout: { name: "Lookout Points", group: L.layerGroup() },
            chad: { name: "Chads", group: L.layerGroup() },
            radio: { name: "Radios", group: L.layerGroup() },
            memory: { name: "Memories", group: L.layerGroup() },
            pub: { name: "Public Houses", group: L.layerGroup() },
            caravan: { name: "Caravans", group: L.layerGroup() },
        };

        // Create custom icons for each marker type
        const customIcons = {
            poi: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-marker.png',
                iconSize: [32, 32]
            }),
            phone: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-phone.png',
                iconSize: [32, 32]
            }),
            youarehere: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-youarehere.png',
                iconSize: [32, 32]
            }),
            chad: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-chad.png',
                iconSize: [32, 32]
            }),
            radio: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-radio.png',
                iconSize: [32, 32]
            }),
            memory: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-memory.png',
                iconSize: [32, 32]
            }),
            pub: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-pub.png',
                iconSize: [32, 32]
            }),
            caravan: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-caravan.png',
                iconSize: [32, 32]
            }),
            lookout: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/everybodysgonetotherapture/icon-lookout.png',
                iconSize: [32, 32]
            })
        };

        // 6. Location Database
        const locations = [
            // Points of Interests
            { id: "poi-1", name: "Valis Observatory", type: "poi", y: 192, x: 887 },
            { id: "poi-2", name: "Yaughton Doctors Surgery", type: "poi", y: 342, x: 491 },
            // Phones & Telephone Boxes
            { id: "phone-1", name: "Phone", type: "phone", y: 281, x: 667 },
            // You Are Here Maps
            { id: "youarehere-1", name: "You Are Here", type: "youarehere", y: 204, x: 775 },
            // Chads
              // add markers here
            // Radios
            { id: "radio-1", name: "Radio", type: "radio", y: 208, x: 771 },
            { id: "radio-2", name: "Radio", type: "radio", y: 852, x: 454 },
            { id: "radio-3", name: "Radio", type: "radio", y: 750, x: 639 },
            { id: "radio-4", name: "Radio", type: "radio", y: 570, x: 490 },
            { id: "radio-5", name: "Radio", type: "radio", y: 795, x: 1194 },
            { id: "radio-6", name: "Radio", type: "radio", y: 895, x: 784 },
            // Memories
              // add markers here
            // Public Houses
            { id: "pub-1", name: "The Stars At Night", type: "pub", y: 252, x: 535 },
            { id: "pub-2", name: "The Seventh Whistler", type: "pub", y: 933, x: 967 }
        ];

        // 6. Registry to look up markers by ID
        const markerRegistry = {};
        let currentOpenMarkerId = null;

        // 7. Initialize URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlMarkerId = urlParams.get('marker');
        const urlFilters = urlParams.get('filters') ? urlParams.get('filters').split(',') : null;

        // 8. Add Markers & Populate Layer Groups
        locations.forEach(loc => {
            const popupContent = `
                <div>
                    <strong>${loc.name}</strong><br>
                    <small>ID: ${loc.id}</small><br>
                    <button class="share-btn" onclick="copyShareableUrl('${loc.id}')">📋 Copy Share Link</button>
                </div>
            `;

            const marker = L.marker([loc.y, loc.x], { icon: customIcons[loc.type] }).bindPopup(popupContent);
            markerRegistry[loc.id] = { marker, type: loc.type, coords: [loc.y, loc.x] };

            if (filterGroups[loc.type]) {
                marker.addTo(filterGroups[loc.type].group);
            }

            // Update URL when a marker popup is opened/closed
            marker.on('popupopen', () => {
                currentOpenMarkerId = loc.id;
                updateURL();
            });

            marker.on('popupclose', () => {
                if (currentOpenMarkerId === loc.id) {
                    currentOpenMarkerId = null;
                    updateURL();
                }
            });
        });

        // 9. Apply Active Filter Groups to Map
        const layerControls = {};
        Object.keys(filterGroups).forEach(key => {
            const groupInfo = filterGroups[key];
            layerControls[groupInfo.name] = groupInfo.group;

            // If filters are specified in URL, enable matching ones; otherwise enable all by default
            if (!urlFilters || urlFilters.includes(key)) {
                groupInfo.group.addTo(map);
            }
        });

        // Add Leaflet Layer Control
        L.control.layers(null, layerControls, { collapsed: false }).addTo(map);

        // Listen for filter toggle events to sync URL
        map.on('overlayadd overlayremove', updateURL);

        // 10. Functions to Handle URL State & Copying
        function updateURL() {
            const activeFilters = Object.keys(filterGroups).filter(key => map.hasLayer(filterGroups[key].group));
            const params = new URLSearchParams();

            if (activeFilters.length > 0 && activeFilters.length < Object.keys(filterGroups).length) {
                params.set('filters', activeFilters.join(','));
            }

            if (currentOpenMarkerId) {
                params.set('marker', currentOpenMarkerId);
            }

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
        }

        function copyShareableUrl(markerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('marker', markerId);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert('Shareable link copied to clipboard!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        // 11. Initial View & Deep Linking Setup
        if (urlMarkerId && markerRegistry[urlMarkerId]) {
            const target = markerRegistry[urlMarkerId];
            
            // Ensure the parent layer group is visible
            if (!map.hasLayer(filterGroups[target.type].group)) {
                filterGroups[target.type].group.addTo(map);
            }

            map.setView(target.coords, 1);
            target.marker.openPopup();
        } else {
            map.fitBounds(bounds);
        }
    </script>
