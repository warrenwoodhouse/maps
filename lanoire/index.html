<body>
    <p style="color:white; margin: 10px;">L.A. Noire Interactive Map - Maps - Warren Woodhouse</p>
    <p style="color:white; margin: 10px;">Map by Warren Woodhouse. <a href="https://warrenwoodhouse.github.io/maps" style="color: #4da6ff;">CLICK HERE</a> to see more Interactive Maps.</p>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Define Map Dimensions
        const mapWidth = 4600;
        const mapHeight = 3580;

        // 2. Initialize Map with CRS.Simple (for flat images instead of globes)
        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -1,
            maxZoom: 3
        });

        // 3. Set Bounds [Bottom-Left, Top-Right]
        const bounds = [[0, 0], [mapHeight, mapWidth]];

        // 4. Load the 4600x3580 Image Overlay
        L.imageOverlay('https://warrenwoodhouse.github.io/maps/lanoire/map.png', bounds).addTo(map);
        map.fitBounds(bounds);

        // 5. Create Layer Groups for Filters
        const filterGroups = {
            poi: { name: "Points of Interests", group: L.layerGroup() },
            case: { name: "Cases", group: L.layerGroup() },
            storycase: { name: "Story Cases", group: L.layerGroup() },
            victim: { name: "Victims", group: L.layerGroup() },
            suspect: { name: "Suspects", group: L.layerGroup() },
            streetcrime: { name: "Street Crimes", group: L.layerGroup() },
            landmark: { name: "Landmarks", group: L.layerGroup() },
            bridge: { name: "Bridges", group: L.layerGroup() },
            tunnel: { name: "Tunnels", group: L.layerGroup() },
            park: { name: "Parks", group: L.layerGroup() }
        };

        // Create custom icons for each marker type
        const customIcons = {
            poi: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-marker.png',
                iconSize: [32, 32]
            }),
            case: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-case.png',
                iconSize: [32, 32]
            }),
            storycase: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-case.png',
                iconSize: [32, 32]
            }),
            victim: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-victim.png',
                iconSize: [32, 32]
            }),
            suspect: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-suspect.png',
                iconSize: [32, 32]
            }),
            streetcrime: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-streetcrime.png',
                iconSize: [32, 32]
            }),
            landmark: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-landmark.png',
                iconSize: [32, 32]
            }),
            bridge: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-bridge.png',
                iconSize: [32, 32]
            }),
            tunnel: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-tunnel.png',
                iconSize: [32, 32]
            }),
            park: L.icon({
                iconUrl: 'https://warrenwoodhouse.github.io/maps/lanoire/icon-park.png',
                iconSize: [32, 32]
            })
        };

        // 6. Location Database
        const locations = [
            // Points of Interests
            { id: "poi-1", name: "P.E. Freight Depot", type: "poi", y: 490, x: 3916, image: "https://warrenwoodhouse.github.io/maps/lanoire/images/pefreight.png" },
            // Cases
            // Story Cases
            { id: "storycase-1", name: "Upon Reflection", type: "storycase", y: 491, x: 4311, image: "https://warrenwoodhouse.github.io/maps/lanoire/images/patroldesk.png" },
            // Victims
            // Suspects
            // Street Crimes
            // Landmarks
            { id: "landmark-1", name: "4th Street Viaduct", type: "landmark", y: 775, x: 4282, image: "https://warrenwoodhouse.github.io/maps/lanoire/images/4thstreetviaduct.png" },
            { id: "landmark-2", name: "6th Street Viaduct", type: "landmark", y: 656, x: 4299, image: "" },
            { id: "landmark-3", name: "National Biscuit Company", type: "landmark", y: 528, x: 4129, image: "" },
            { id: "landmark-4", name: "L.A. Cold Storage", type: "landmark", y: 890, x: 3918, image: "" },
            { id: "landmark-5", name: "Union Station", type: "landmark", y: 1401, x: 4006, image: "" },
            { id: "landmark-6", name: "El Pueblo de Los Angeles", type: "landmark", y: 1416, x: 3926, image: "" },
            { id: "landmark-7", name: "Chinatown", type: "landmark", y: 1785, x: 3987, image: "" },
            { id: "landmark-8", name: "Hall of Records", type: "landmark", y: 1327, x: 3752, image: "" },
            { id: "landmark-9", name: "Angels Flight", type: "landmark", y: 1205, x: 3558, image: "" },
            { id: "landmark-10", name: "The Bradbury Building", type: "landmark", y: 1161, x: 3609, image: "" },
            { id: "landmark-11", name: "L.A. Public Library", type: "landmark", y: 1145, x: 3355, image: "" },
            { id: "landmark-12", name: "Pershing Square", type: "landmark", y: 1063, x: 3433, image: "" },
            { id: "landmark-13", name: "Main Street Terminal", type: "landmark", y: 903, x: 3538, image: "" },
            { id: "landmark-14", name: "R.K.O. Theater", type: "landmark", y: 890, x: 3321, image: "" },
            { id: "landmark-15", name: "Los Angeles Examiner", type: "landmark", y: 686, x: 3206, image: "" },
            { id: "landmark-16", name: "Intolerance Set", type: "landmark", y: 1057, x: 3063, image: "" },
            { id: "landmark-17", name: "Christ Crown of Thorns", type: "landmark", y: 1007, x: 2942, image: "" },
            { id: "landmark-18", name: "The Mayfair Hotel", type: "landmark", y: 1218, x: 2918, image: "" },
            { id: "landmark-19", name: "The Good Samaritan Hospital", type: "landmark", y: 1302, x: 3005, image: "" },
            { id: "landmark-20", name: "MacArthur Park", type: "landmark", y: 1495, x: 2574, image: "" },
            { id: "landmark-21", name: "Park Plaza", type: "landmark", y: 1587, x: 2503, image: "" },
            { id: "landmark-22", name: "L.A. County Museum", type: "landmark", y: 1408, x: 2300, image: "" },
            { id: "landmark-23", name: "Westlake Tar Pits", type: "landmark", y: 1285, x: 2269, image: "" },
            { id: "landmark-24", name: "Bullocks Wilshire", type: "landmark", y: 1603, x: 2187, image: "" },
            { id: "landmark-25", name: "Brown Derby", type: "landmark", y: 3217, x: 847, image: "" },
            { id: "landmark-26", name: "Crossroads of the World", type: "landmark", y: 3128, x: 534, image: "" },
            { id: "landmark-27", name: "Musso & Franks", type: "landmark", y: 3278, x: 530, image: "" },
            { id: "landmark-28", name: "Max Factor Building", type: "landmark", y: 3241, x: 419, image: "" },
            { id: "landmark-29", name: "Grauman’s Theater", type: "landmark", y: 3290, x: 331, image: "" },
            { id: "landmark-30", name: "Hotel Roosevelt", type: "landmark", y: 3256, x: 299, image: "" },
            // Bridges
            { id: "bridge-1", name: "4th Street Viaduct", type: "bridge", y: 775, x: 4282, image: "" },
            { id: "bridge-2", name: "6th Street Viaduct", type: "bridge", y: 656, x: 4299, image: "" },
            { id: "bridge-3", name: "7th Street Viaduct", type: "bridge", y: 489, x: 4328, image: "" },
            { id: "bridge-4", name: "Olympic Boulevard Viaduct", type: "bridge", y: 120, x: 4398, image: "" },
            { id: "bridge-5", name: "Aliso Viaduct", type: "bridge", y: 1262, x: 4288, image: "" },
            { id: "bridge-6", name: "1st Street Viaduct", type: "bridge", y: 1045, x: 4238, image: "" },
            { id: "bridge-7", name: "Macy Street Viaduct", type: "bridge", y: 1335, x: 4343, image: "" },
            { id: "bridge-8", name: "Grand Avenue Bridge", type: "bridge", y: 1526, x: 3695, image: "" },
            { id: "bridge-9", name: "MacArthur Park Bridge", type: "bridge", y: 1519, x: 2566, image: "" },
            // Tunnels
            { id: "tunnel-1", name: "Hill Street Tunnel", type: "tunnel", y: 1344, x: 3674, image: "" },
            { id: "tunnel-2", name: "Broadway Tunnel", type: "tunnel", y: 1488, x: 3861, image: "" },
            { id: "tunnel-3", name: "2nd Street Tunnel", type: "tunnel", y: 1274, x: 3605, image: "" },
            { id: "tunnel-4", name: "3rd Street Tunnel", type: "tunnel", y: 1215, x: 3553, image: "" },
            { id: "tunnel-5", name: "Cesar Chavez Avenue Tunnel", type: "tunnel", y: 1433, x: 4126, image: "" },
            { id: "tunnel-6", name: "Train Tunnel", type: "tunnel", y: 1569, x: 3773, image: "" },
            { id: "tunnel-7", name: "Pedestrian Subway Tunnel", type: "tunnel", y: 1137, x: 3468, image: "" }
        ];

        // 6. Registry to look up markers by ID
        const markerRegistry = {};
        let currentOpenMarkerId = null;

        // 7. Initialize URL Parameters
        const urlParams = new URLSearchParams(window.location.search);
        const urlMarkerId = urlParams.get('marker');
        const urlFilters = urlParams.get('filters') ? urlParams.get('filters').split(',') : null;

        // 8. Add Markers & Populate Layer Groups
        locations.forEach(loc => {
            const popupContent = `
                <div>
                    ${loc.image ? `<img src="${loc.image}" alt="${loc.name}" class="popup-image" onerror="this.style.display='none'">` : ''}
                    <div class="popup-text">
                        <strong>${loc.name}</strong>
                        <small>ID: ${loc.id}</small>
                    </div>
                    <button class="share-btn" onclick="copyShareableUrl('${loc.id}')">📋 Copy Share Link</button>
                </div>
            `;

            const marker = L.marker([loc.y, loc.x], { icon: customIcons[loc.type] }).bindPopup(popupContent);
            markerRegistry[loc.id] = { marker, type: loc.type, coords: [loc.y, loc.x] };

            if (filterGroups[loc.type]) {
                marker.addTo(filterGroups[loc.type].group);
            }

            // Update URL when a marker popup is opened/closed
            marker.on('popupopen', () => {
                currentOpenMarkerId = loc.id;
                updateURL();
            });

            marker.on('popupclose', () => {
                if (currentOpenMarkerId === loc.id) {
                    currentOpenMarkerId = null;
                    updateURL();
                }
            });
        });

        // 9. Apply Active Filter Groups to Map
        const layerControls = {};
        Object.keys(filterGroups).forEach(key => {
            const groupInfo = filterGroups[key];
            layerControls[groupInfo.name] = groupInfo.group;

            // If filters are specified in URL, enable matching ones; otherwise enable all by default
            if (!urlFilters || urlFilters.includes(key)) {
                groupInfo.group.addTo(map);
            }
        });

        // Add Leaflet Layer Control
        L.control.layers(null, layerControls, { collapsed: false }).addTo(map);

        // Listen for filter toggle events to sync URL
        map.on('overlayadd overlayremove', updateURL);

        // 10. Functions to Handle URL State & Copying
        function updateURL() {
            const activeFilters = Object.keys(filterGroups).filter(key => map.hasLayer(filterGroups[key].group));
            const params = new URLSearchParams();

            if (activeFilters.length > 0 && activeFilters.length < Object.keys(filterGroups).length) {
                params.set('filters', activeFilters.join(','));
            }

            if (currentOpenMarkerId) {
                params.set('marker', currentOpenMarkerId);
            }

            const queryString = params.toString();
            const newUrl = queryString ? `${window.location.pathname}?${queryString}` : window.location.pathname;
            window.history.replaceState({}, '', newUrl);
        }

        function copyShareableUrl(markerId) {
            const url = new URL(window.location.href);
            url.searchParams.set('marker', markerId);
            
            navigator.clipboard.writeText(url.toString()).then(() => {
                alert('Shareable link copied to Case File!');
            }).catch(err => {
                console.error('Error copying link: ', err);
            });
        }

        // 11. Initial View & Deep Linking Setup
        if (urlMarkerId && markerRegistry[urlMarkerId]) {
            const target = markerRegistry[urlMarkerId];
            
            // Ensure the parent layer group is visible
            if (!map.hasLayer(filterGroups[target.type].group)) {
                filterGroups[target.type].group.addTo(map);
            }

            map.setView(target.coords, 1);
            target.marker.openPopup();
        } else {
            map.fitBounds(bounds);
        }
    </script>
