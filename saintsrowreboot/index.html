<html>
  <head>
    <title>Saints Row Reboot Interactive Map - Maps - Warren Woodhouse</title>
  </head>
  <body>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.0/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.3.0/dist/leaflet.js"></script>
    <script>
    // Map Data
    window.addEventListener("DOMContentLoaded", function(){
      const map = L.map('map3', {
        maxZoom:4,
        minZoom:1,
        crs: L.CRS.Simple
      }).setView([100, 275], 1);
      const h = 560;
      const w = 980;
      const southWest = [0, w/4.5];
      const northEast = [h/4.5, 0];
      const imageBounds = new L.LatLngBounds(southWest, northEast);
      map.setMaxBounds(new L.LatLngBounds([0,0], [h/4.5, w/4.5]));
      // This is the Map Base URL
      const imageUrl0 = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/map.jpeg',imageBounds);
      const baseMaps = {};
      // This is the Overlay Layer URLs

      const districts = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/districts.png',imageBounds);
      const discoveries = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/discoveries.png',imageBounds);
      const sidehustles = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/hustles.png',imageBounds);
      const collectibles = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/collectibles.png',imageBounds);
      const threats = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/threats.png',imageBounds);
      const stores = L.imageOverlay('https://raw.githubusercontent.com/warrenwoodhouse/maps/refs/heads/main/saintsrowreboot/stores.png',imageBounds);

;

      // Overlay Layer Names
      const overlayMaps = {
        "Districts": districts,
        "Discoveries": discoveries,
        "Side Hustles": sidehustles,
        "Collectibles": collectibles,
        "Threats": threats,
        "Stores": stores,

      };
      imageUrl0.addTo(map);
      buy01.addTo(map);
      L.control.layers(baseMaps,overlayMaps,{collapsed:true}).addTo(map);
    });
  </script>
</body>
</html>
