<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>007 First Light Real Life Locations Map - Maps - Warren Woodhouse</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    
    <!-- FontAwesome for custom icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; }
        
        .custom-popup .leaflet-popup-content-wrapper {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
        }
        .custom-popup .leaflet-popup-tip {
            background: #2c3e50;
        }
        .popup-title {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }
        .popup-desc {
            font-size: 0.95em;
            line-height: 1.4;
        }
        .popup-id {
            font-size: 0.95em;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    
    <!-- Leaflet Omnivore for parsing KML (if user provides it) -->
    <script src="https://api.tiles.mapbox.com/mapbox.js/plugins/leaflet-omnivore/v0.3.1/leaflet-omnivore.min.js"></script>

    <script>
        // Initialize the map
        var map = L.map('map').setView([51.487222, -0.124167], 4);

        // Add standard OpenStreetMap tiles
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors | Map Created By: <a href="https://warrenwoodhouse.blogspot.com/">Warren Woodhouse</a>'
        }).addTo(map);

        // Custom icon design
        var Icon = L.divIcon({
            html: '<i class="fa-solid fa-location-dot fa-2x" style="color: #c0392b; text-shadow: 1px 1px 2px black;"></i>',
            iconSize: [20, 20],
            className: 'custom-icon'
        });

        // Locations
        var locations = [
            {
                name: "MI6 Research Facility and Crash Site, Iceland",
                lat: 64.403333,
                lng: -17.585833,
                desc: "A crash site over run by an elusive enemy organisation.",
                id: "1"
            },
            {
                name: "MI6 Malta Training Ground",
                lat: 35.9021876,
                lng: 14.518689,
                desc: "Training Grounds for New Recruits.",
                id: "2"
            },
            {
                name: "MI6 R&D Division, MI Building",
                lat: 51.487222,
                lng: -0.124167,
                desc: "MI6 Headquarters in the heart of London.",
                id: "3"
            },
            {
                name: "The ARCH Club",
                lat: -0.124167,
                lng: -0.099722,
                desc: "Time to let your hair down in this nightclub.",
                id: "4"
            },
            {
                name: "Grand Carpathian Hotel, Slovakia",
                lat: 49.118472,
                lng: 20.062500,
                desc: "Time to track down a blonde bloke at a chess game in this luxury hotel.",
                id: "5"
            },
            {
                name: "Aleph and Transworld Wreck, Mauritania",
                lat: 18.726389,
                lng: -16.158056,
                desc: "A shipwreck worth investigating.",
                id: "6"
            },
            {
                name: "Work and Arts Museum / The Perch / Webb Industries",
                lat: 51.511944,
                lng: -0.127222, 
                desc: "A sinister plot thickens...",
                id: "7"
            },
            {
                name: "The Pearl, Vietnam",
                lat: 12.238889,
                lng: 109.195000, 
                desc: "An epic conclusion.",
                id: "8"
            }
        ];

        // Add markers to the map
        locations.forEach(function(loc) {
            var popupContent = '<div class="popup-title">' + loc.name + '</div>' +
                               '<div class="popup-id">' + loc.id + '</div>' +
                               '<div class="popup-desc">' + loc.desc + '</div>';
            
            L.marker([loc.lat, loc.lng, loc.id], { icon: Icon })
                .bindPopup(popupContent, { className: 'custom-popup' })
                .addTo(map);
        });      
    </script>
</body>
</html>
