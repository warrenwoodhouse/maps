<html>
<head>
    <title>This Bed We Made Franchise Real Life Map - Maps - Warren Woodhouse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h3></h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([45.5018869, -73.5673919], 18);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors | Map By: <a href="https://warrenwoodhouse.blogspot.com/">Warren Woodhouse</a>'
        }).addTo(map);

        // Define the custom icon first
        var Icon = L.icon({
            iconUrl: 'https://raw.githubusercontent.com/warrenwoodhouse/maps/main/icons/icon-thisbedwemade.png',
            iconSize:     [38, 95], // size of the icon
            iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
            popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
        });

        // Define the locations array
        var locations = [
            ["Montréal", 45.5018869, -73.5673919],
            ["The Clarington Hotel", 45.5062781, -73.5553576],
            ["The Lake -Mentioned Only-", 45.4988179, -73.5973997],
            ["Paul Morgan's House -Mentioned Only-", 39.2748959, -80.3323467],
            ["Edith & Lindsey Franklin's House -Mentioned Only-", 44.4838810, -73.2194091]
        ];

        // Add markers to map
        for (var i = 0; i < locations.length; i++) {
            marker = new L.marker([locations[i][1], locations[i][2]], {icon: Icon})
                .bindPopup(locations[i][0])
                .addTo(map);
        }
    </script>
</body>
</html>
