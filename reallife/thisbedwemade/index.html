<!DOCTYPE html>
<html>
<head>
    <title>This Bed We Made Franchise Real Life Map - Maps - Warren Woodhouse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h3></h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        var map = L.map('map').setView([45.5018869, -73.5673919], 18);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© Map by Warren Woodhouse. Made using LeafletJS and OpenStreetMap contributors'
        }).addTo(map);

        var marker = L.marker(["Montréal", 45.5018869, -73.5673919]).addTo(map) {icon: Icon};
        var marker = L.marker(["The Clarington Hotel", 45.5062781, -73.5553576]).addTo(map) {icon: Icon};
        var marker = L.marker(["The Lake -Mentioned Only-", 45.4988179, -73.5973997]).addTo(map) {icon: Icon};
        var marker = L.marker(["Paul Morgan's House -Mentioned Only-", 39.2748959, -80.3323467], {icon: Icon};
        var marker = L.marker(["Edith & Lindsey Franklin's House -Mentioned Only-", 44.4838810, -73.2194091], {icon: Icon};
        ];

      for (var i = 0; i < locations.length; i++) {
  marker = new L.marker([locations[i][1], locations[i][2]])
    .bindPopup(locations[i][0])
    .addTo(map);

      var Icon = L.icon({
    iconUrl: 'https://github.com/warrenwoodhouse/maps/raw/refs/heads/main/reallife/thisbedwemade/icon.PNG',
    shadowUrl: 'https://github.com/warrenwoodhouse/maps/raw/refs/heads/main/reallife/thisbedwemade/icon.PNG',

    iconSize:     [38, 95], // size of the icon
    shadowSize:   [50, 64], // size of the shadow
    iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
    shadowAnchor: [4, 62],  // the same for the shadow
    popupAnchor:  [-3, -76] // point from which the popup should open relative to the iconAnchor
});
    </script>
</body>
</html>
