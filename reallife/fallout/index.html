<!DOCTYPE html>
<html>
<head>
    <title>Fallout Real Life Map - Maps - Warren Woodhouse</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h3></h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 4. Initialize the map
        var map = L.map('map').setView([34.3109622, -118.2336634], 8);

        // 5. Add OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 6. Add a Marker
        L.marker([36.5784990, -118.2922600]).addTo(map)
            .bindPopup('Vault 13 - FO1')
            .openPopup();
        L.marker([34.0522340, -118.2436850]).addTo(map)
            .bindPopup('Boneyard - FO1')
            .openPopup();
        L.marker([34.8957960, -117.0172830]).addTo(map)
            .bindPopup('The Hub - FO1')
            .openPopup();
        L.marker([35.3732920, -119.0187120]).addTo(map)
            .bindPopup('Necropolis - FO1')
            .openPopup();
        L.marker([35.2709291, -119.3236519]).addTo(map)
            .bindPopup('Vault 12 - FO1')
            .openPopup();
        L.marker([35.6163490, -119.6942940]).addTo(map)
            .bindPopup('Lost Hills - FO1')
            .openPopup();
        L.marker([37.4849377, -119.9662843]).addTo(map)
            .bindPopup('Mariposa Military Base - FO1')
            .openPopup();
        L.marker([36.6766661, -117.0676047]).addTo(map)
            .bindPopup('Vault 15 - FO1')
            .openPopup();
        L.marker([36.6060444, -118.0628654]).addTo(map)
            .bindPopup('Shady Sands - FO1')
            .openPopup();
        L.marker([41.6796500, -120.8969220]).addTo(map)
            .bindPopup('Modoc - FO2')
            .openPopup();
        L.marker([39.1035360, -117.9695650]).addTo(map)
            .bindPopup('Broken Hills - FO2')
            .openPopup();
        L.marker([39.1518430, -123.5419560]).addTo(map)
            .bindPopup('Navarro - FO2')
            .openPopup();
        L.marker([42.2248670, -121.7816700]).addTo(map)
            .bindPopup('Klamath - FO2')
            .openPopup();
        L.marker([39.5296330, -119.8138030]).addTo(map)
            .bindPopup('New Reno - FO2')
            .openPopup();
        L.marker([39.5291688, -119.8146442]).addTo(map)
            .bindPopup('Desperado - FO2')
            .openPopup();
        L.marker([39.5281622, -119.8136810]).addTo(map)

        L.marker([40.5865400, -122.3916750]).addTo(map)
            .bindPopup('Redding - FO2')
            .openPopup();
        L.marker([37.7749300, -122.4194160]).addTo(map)
            .bindPopup('San Francisco - FO2')
            .openPopup();
        L.marker([40.2064960, -120.1182660]).addTo(map)
            .bindPopup('Sierra Army Depot - FO2')
            .openPopup();
        L.marker([37.4849300, -119.9662800]).addTo(map)
            .bindPopup('Mariposa Military Base - FO2')
            .openPopup();
        L.marker([36.6060444, -118.0628654]).addTo(map)

        L.marker([36.5784990, -118.2922600]).addTo(map)
            .bindPopup('Vault 13  - FO2')
            .openPopup();
        L.marker([36.6766661, -117.0676047]).addTo(map)
            .bindPopup('Vault 15  - FO2')
            .openPopup();
        L.marker([37.2333300, -115.8083300]).addTo(map)
            .bindPopup('Area 51 (Cut Content  - FO2')
            .openPopup();
    </script>
</body>
</html>
