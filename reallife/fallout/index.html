<html>
<head>
    <title>Fallout Real Life Map - Maps - Warren Woodhouse</title>
        
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- FontAwesome for custom icons -->

    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #map { width: 100vw; height: 100vh; }

        /* Custom Dropdown Control Styles */
        #controls {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000; /* Ensures it sits above the map tiles */
            background: rgba(44, 62, 80, 0.9);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.5);
            color: white;
        }

        #location-select {
            padding: 8px;
            font-size: 14px;
            border-radius: 4px;
            border: none;
            background: #ecf0f1;
            color: #2c3e50;
            outline: none;
            cursor: pointer;
            width: 250px;
        }

        /* Popup Styles */
        .custom-popup .leaflet-popup-content-wrapper {
            background: #2c3e50;
            color: #ecf0f1;
            border-radius: 8px;
        }
        .custom-popup .leaflet-popup-tip {
            background: #2c3e50;
        }
        .popup-title {
            font-size: 3.0em;
            font-weight: bold;
            margin-bottom: 5px;
            border-bottom: 1px solid #34495e;
            padding-bottom: 5px;
        }
        .popup-type {
            font-size: 2.5em;
            line-height: 1.4;
        }
        .popup-game {
            font-size: 2.5em;
            line-height: 1.4;
        }
    </style>
</head>

            { name: "Golden Gate Bridge", lat: 37.8199286, lng: -122.4782551, type: "Landmark", game: "Fallout 2", icon: goldengatebridgeIcon },

        // Sort locations alphabetically to make the dropdown easier to use
        locations.sort(function(a, b) { return a.name.localeCompare(b.name); });

        var selectDropdown = document.getElementById('location-select');

        // 5. Add Custom Icons to the Map & Populate Dropdown
        locations.forEach(function(loc, index) {
            
            // Build Popup HTML
            var popupContent = '<div class="popup-title">' + loc.name + '</div>' +
                               '<div class="popup-type">' + loc.type + '</div>' +
                               '<div class="popup-game">' + loc.game + '</div>';
            
            // FIX: Use the specific icon from the array, or default to unmarkedIcon
            var currentIcon = loc.icon ? loc.icon : unmarkedIcon;

            // Add marker to map using the corrected icon variable
            loc.markerObj = L.marker([loc.lat, loc.lng], { icon: currentIcon })
                .bindPopup(popupContent, { className: 'custom-popup' })
                .addTo(map);

            // Create dropdown option
            var option = document.createElement('option');
            option.value = index; 
            option.text = loc.name + " (" + loc.game + ")";
            selectDropdown.appendChild(option);
        });

        // 6. Handle Dropdown Selection Event
        selectDropdown.addEventListener('change', function(e) {
            var selectedIndex = e.target.value;
            
            if(selectedIndex !== "") {
                var selectedLoc = locations[selectedIndex];
                
                // Fly to the marker and zoom in (10 is the zoom level)
                map.flyTo([selectedLoc.lat, selectedLoc.lng], 10, {
                    animate: true,
                    duration: 1.5 // Duration in seconds
                });

                // Open the popup once we fly there
                map.once('moveend', function() {
                    selectedLoc.markerObj.openPopup();
                });
            }
        });

    </script>
