<!DOCTYPE html>
<html>
<head>
    <title>Ouseburn Farm Water Feature by Warren Woodhouse (Creations) (Gardening)</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map { height: 500px; width: 100%; }
    </style>
</head>
<body>
    <h3>Ouseburn Farm Water Feature by Warren Woodhouse (Creations) (Gardening)</h3>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 4. Initialize the map
        var map = L.map('map').setView([54.9754417, -1.5913017], 18);

        // 5. Add OpenStreetMap Tile Layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors; Made using Leaflet; Water Feature and Map by Warren Woodhouse'
        }).addTo(map);

        // 6. Add a Marker
        L.marker([54.9754417, -1.5913017]).addTo(map)
            .bindPopup('Location of the Water Feature I made at Ouseburn Farm')
            .openPopup();
    </script>
</body>
</html>
